<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة أورجينال أسيوط - ش الجمهورية - بجوار فرع فودافون</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    body {
      background-image: url('icon0.jpg');
      background-size: 100% 95%;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #1a1a24;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      gap: 20px;
      text-align: center;
    }

    /* تكبير الصندوق الرئيسي */
    .container {
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 35px 40px;
      max-width: 580px; /* تم تكبير الحجم من 500px */
      width: 95%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      margin-bottom: 20px; /* مسافة إضافية أسفل الصندوق */
    }

    h1 {
      font-size: 2.3rem;
      margin-bottom: 10px;
      color: #4facfe;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    h3 {
      font-size: 1.2rem;
      font-weight: 400;
      color: #00f2fe;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin: 20px 0 25px 0;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    #kernel-options {
      display: flex;
      gap: 25px;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 1.05rem;
    }

    #kernel-options label {
      cursor: pointer;
      font-weight: bold;
    }

    /* تكبير زر الجيلبريك */
    #jeilbrek {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      font-size: 1.4rem; /* كبّرنا الخط */
      border: none;
      padding: 16px 50px; /* كبّرنا الأبعاد والمسافات */
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
    }

    #jeilbrek:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.6);
    }

    #jeilbrek:disabled {
      background: #555555;
      color: #888888;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .autoJb {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      margin-top: 5px;
    }

    /* إنزال الكنسول للأسفل وإعطائه مسافة مستقلة */
    #console {
      display: block !important;
      direction: ltr !important;
      text-align: left !important;
      
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      max-width: 580px; /* مطابق لعرض الصندوق الأعلى */
      width: 95%;
      height: 180px;
      max-height: 250px;
      overflow-y: auto;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      
      word-break: break-word;
      white-space: pre-wrap;
      margin-top: 15px; /* إبعاد الكنسول للأسفل عن الصندوق */
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Original Host</h1>
    <h3 id="UA">Running on:</h3>

    <hr>

    <div class="btn-container">
      <form id="kernel-options">
        <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
        <label for="netctrl-exploit">NetCtrl</label>
        
        <input type="radio" name="kernel" id="lapse-exploit" value="lapse" checked>
        <label for="lapse-exploit">Lapse</label>
      </form>

      <button id="jeilbrek">Jailbreak</button>

      <div class="autoJb">
        <input id="autoJbInput" type="checkbox">
        <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
      </div>
    </div>
  </div>

  <pre id="console">Ready. Awaiting execution...</pre>

  <script>
    function printToConsole(msg) {
      const c = document.getElementById("console");
      if (c) {
        c.innerText += "\n" + msg;
        c.scrollTop = c.scrollHeight;
      }
    }

    window.logger = {
      info: function(msg) { printToConsole("[+] " + msg); },
      error: function(msg) { printToConsole("[!] ERROR: " + msg); },
      log: function(msg) { printToConsole("[*] " + msg); }
    };

    window.onerror = function(message, source, lineno, colno, error) {
      printToConsole("[CRITICAL ERROR] " + message + " (Line: " + lineno + ")");
      return false;
    };

    function load_script(src, remote = true, transfer = []) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => reject(new Error("Failed to load script: " + src));
        document.head.appendChild(script);
      });
    }

    async function doJb() {
      await load_script("src/misc.js");

      try {
        version.init();
        switch (version.console) {
          case 4:
            await load_script("src/ps4/constants.js");
            await load_script("src/ps4/userland.js");
            break;
          case 5:
            break;
          default:
            logger.info(`Unsupported console ${version.console}`);
        }

        logger.info("===USERLAND===");

        let rw = undefined;
        if (arw.master === undefined) {
          rw = await init_rw();
        }

        init_arw(rw);
        init_rop();
        init_syscalls();

        logger.info("===END===");

        await load_script("src/loader.js");
        await load_script("src/workers.js");

        switch (version.console) {
          case 4:
            await load_script("src/ps4/kernel.js");
            break;
          case 5:
            break;
          default:
            logger.info(`Unsupported console ${version.console}`);
        }

        await load_script(`src/${exploitChain}.js`);

        logger.info(`===${exploitChain.toUpperCase()}===`);

        try {
          if (exploitChain == "lapse") {
            init();
            await setup();
            await double_free_reqs2();
            leak_kaddrs();
            double_free_reqs1();
            make_karw();

            inc_karw_pipe_refcnt();

            logger.info("Corrupted context cleanup started...");
            remove_pktinfo_from_so(pktopts_twins[0]);
            remove_rthdr_from_so(pktopts_twins[1]);
            remove_rthdr_from_so(rthdr_twins[0]);

            logger.info("Corrupted context cleanup completed !!");
          } else {
            init();
            await setup();
            await ucred_triple_free();
            leak_kqueue();
            await make_karw();

            inc_karw_pipe_refcnt();

            logger.info("Corrupted context cleanup started...");
            for (let i = 0; i < triplets.length; i++) {
              remove_rthdr_from_so(triplets[i]);
            }
            remove_uaf_file();

            logger.info("Corrupted context cleanup completed !!");
          }
        } finally {
          cleanup();
        }

        find_all_proc();

        if (fn.setuid.invoke(0) === -1) {
          jailbreak();

          const kpatches_rsp = await fetch(`src/ps4/patches/${constants.KPATCH}`);
          const kpatches_buf = await kpatches_rsp.arrayBuffer();
          const kpatches_u8 = new Uint8Array(kpatches_buf);

          kernel_patches(kpatches_u8);

          const bin_rsp = await fetch("src/payload.bin");
          const bin_buf = await bin_rsp.arrayBuffer();
          const bin_u8 = new Uint8Array(bin_buf);

          load_bin(bin_u8);
        }

        logger.info("===END===");
      } catch (e) {
        logger.error(e.message);
        logger.error(e.stack);
      }
    }

    if (localStorage.getItem("autoJb") === null) {
      localStorage.setItem("autoJb", "false");
    }
  </script>

  <script src="includes/script.js"></script>

</body>
</html>
