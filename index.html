<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شركة أورجينال أسيوط - ش الجمهورية - بجوار فرع فودافون</title>
  <style>
    /* إعادة ضبط الهوامش والأبعاد */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ضبط خلفية الصفحة لترميها وتتناسب مع جميع الشاشات */
    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    body {
      /* قم بتغيير 'custom-bg.jpg' باسم ملف الصورة الخاص بك */
      background-image: url('icon0.jpg');
      background-size: 100% 95%;          /* تجعل الصورة تغطي كامل الشاشة دون تشويه */
      background-position: center;      /* تمركز الصورة في الوسط تماماً */
      background-repeat: no-repeat;    /* تمنع تكرار الصورة */
      background-attachment: fixed;    /* ثبات الخلفية عند السكرول إن وجد */
      background-color: #1a1a24;       /* لون احتياطي غامق في حال عدم تحميل الصورة */

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    /* طبقة زجاجية شفافة فوق الخلفية لزيادة وضوح العناصر (اختياري) */
    .container {
      background: rgba(15, 15, 25, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #4facfe;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    h3 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #00f2fe;
      margin-bottom: 20px;
    }

    hr {
      border: none;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      margin: 15px 0 25px 0;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    #kernel-options {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 20px;
      border-radius: 30px;
    }

    #kernel-options label {
      cursor: pointer;
      font-weight: bold;
    }

    #jeilbrek {
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #000;
      font-weight: bold;
      font-size: 1.2rem;
      border: none;
      padding: 12px 35px;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    #jeilbrek:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
    }

    .autoJb {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      margin-top: 5px;
    }

    /* إخفاء العناصر غير المرغوبة تلقائياً مع الإبقاء عليها في الـ DOM برمجياً */
    .media-box, #console, .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Original Host</h1>
    <h3 id="UA">Running on:</h3>

    <hr>

    <div class="btn-container">
      <form id="kernel-options">
        <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
        <label for="netctrl-exploit">NetCtrl</label>
        
        <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
        <label for="lapse-exploit">Lapse</label>
      </form>

      <button id="jeilbrek">Jeilbrek</button>

      <div class="autoJb">
        <input id="autoJbInput" type="checkbox">
        <label for="autoJbInput" id="autoJbLabel">Auto Jailbreak</label>
      </div>
    </div>
  </div>

  <!-- العنصر الذي يحتاجه السكريبت البرمجي للطباعة مفعل كعنصر مخفي -->
  <pre id="console" class="hidden">Ready. Awaiting execution...</pre>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>

  <!-- كود التفعيل والتشغيل التلقائي المباشر -->
  <script>
    window.addEventListener('load', () => {
      const autoJbInput = document.getElementById('autoJbInput');
      const jbButton = document.getElementById('jeilbrek');

      // 1. استرجاع حالة الحفظ السابقة إذا وجدت، أو التفعيل الافتراضي
      const isAutoStored = localStorage.getItem('autoJb');
      
      // إذا لم تكن هناك حالة محفوظة سابقاً، نقوم بتفعيلها تلقائياً
      if (isAutoStored === null || isAutoStored === 'true') {
        if (autoJbInput) autoJbInput.checked = true;
        localStorage.setItem('autoJb', 'true');
        
        // إعطاء مهلة زمنية قصيرة لضمان جاهزية السكريبتات الأساسية ثم الضغط تلقائياً
        setTimeout(() => {
          if (jbButton) {
            jbButton.click();
          }
        }, 1000);
      } else {
        if (autoJbInput) autoJbInput.checked = false;
      }

      // 2. تحديث الحفظ فور تغيير خيار التشغيل التلقائي من المستخدم
      if (autoJbInput) {
        autoJbInput.addEventListener('change', (e) => {
          localStorage.setItem('autoJb', e.target.checked ? 'true' : 'false');
        });
      }
    });
  </script>
</body>
</html>
